<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f6f4;
            color: #1f1f1f;
        }

        .calculator {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e7e4df;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            background: #121212;
            color: #ffffff;
            padding: 24px 28px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #cfcfcf;
        }

        .content {
            padding: 28px;
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #333333;
        }

        select,
        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            background: #faf9f7;
            border: 1px solid #d9d6d1;
            border-radius: 8px;
            font-size: 15px;
            color: #222222;
            transition: 0.2s ease;
        }

        select {
            cursor: pointer;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #121212;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(18, 18, 18, 0.07);
        }

        .amount-wrapper {
            position: relative;
        }

        .dollar-sign {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            color: #666666;
            pointer-events: none;
        }

        .amount-wrapper input {
            padding-left: 30px;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #e7e99b;
            color: #121212;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #dfe283;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #f5f5e7;
            border: 1px solid #e7e99b;
            border-radius: 10px;
            text-align: center;
        }

        .result-label {
            margin: 0 0 7px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #666666;
        }

        .result-amount {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            color: #121212;
        }

        .error {
            display: none;
            margin-top: 12px;
            font-size: 13px;
            color: #b42318;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            .calculator {
                max-width: 100%;
            }

            .content {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="header">
            <h1>GEM Calculator</h1>
            <p>Guest refund accommodation adjustment</p>
        </div>

        <div class="content">

            <div class="field">
                <label for="areas">Area</label>

                <select id="areas">
                    <option value="" selected disabled>Select an area</option>
                    <option value="1.125">TPA - Hillsborough</option>
                    <option value="1.130">TPA - Pinellas</option>
                    <option value="1.125">Monroe</option>
                    <option value="1.130">PCB</option>
                    <option value="1.120">Unincorporated PCB</option>
                    <option value="1.130">Destin</option>
                    <option value="1.125">Daytona</option>
                </select>
            </div>

            <div class="field">
                <label for="amount">Guest Refund</label>

                <div class="amount-wrapper">
                    <span class="dollar-sign">$</span>

                    <input
                        type="number"
                        id="amount"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                    >
                </div>
            </div>

            <button id="calculate">
                CALCULATE ADJUSTMENT
            </button>

            <div class="error" id="error">
                Please select an area and enter a refund amount.
            </div>

            <div class="result" id="result">
                <p class="result-label">
                    Accommodation Fare Adjustment
                </p>

                <p class="result-amount" id="total">
                    $0.00
                </p>
            </div>

        </div>
    </div>


    <script>
        const calculateButton = document.getElementById("calculate");
        const amountInput = document.getElementById("amount");
        const areaSelect = document.getElementById("areas");
        const resultBox = document.getElementById("result");
        const totalDisplay = document.getElementById("total");
        const errorMessage = document.getElementById("error");


        function calculateAdjustment() {

            const amount = parseFloat(amountInput.value);
            const area = parseFloat(areaSelect.value);

            // Validate fields
            if (isNaN(amount) || isNaN(area) || amount < 0) {

                resultBox.style.display = "none";
                errorMessage.style.display = "block";

                return;
            }

            errorMessage.style.display = "none";

            // Calculate accommodation fare adjustment
            const total = amount / area;

            // Format as currency
            totalDisplay.textContent = total.toLocaleString("en-US", {
                style: "currency",
                currency: "USD",
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            resultBox.style.display = "block";
        }


        calculateButton.addEventListener("click", calculateAdjustment);


        // Allow Enter to calculate
        amountInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                calculateAdjustment();
            }

        });
    </script>

</body>
</html>
